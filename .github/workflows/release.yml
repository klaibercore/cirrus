name: Release

on:
  push:
    tags: ['v*.*.*']

# The job creates a release and uploads assets to it.
permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are generated from the range since the previous tag,
          # which needs the full history rather than a shallow clone.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Check the tag matches the app version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $declared in app/build.gradle.kts"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_ENV"

      - name: Restore the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          # A truncated secret decodes without error but produces an unusable file.
          keytool -list -keystore keystore/release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > /dev/null

      - name: Build the release APK
        env:
          KEYSTORE_FILE: keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Name the artifacts and checksum them
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/cirrus-${version}-release.apk"
          cd dist
          sha256sum "cirrus-${version}-release.apk" > "cirrus-${version}-release.apk.sha256"
          cat "cirrus-${version}-release.apk.sha256"

      - name: Generate release notes
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            if [ -n "$previous" ]; then
              echo "### Changes since ${previous}"
              echo
              git log --no-merges --pretty='- %s (%h)' "${previous}..${GITHUB_REF_NAME}"
            else
              echo "### First release"
              echo
              git log --no-merges --pretty='- %s (%h)' "${GITHUB_REF_NAME}"
            fi
            echo
            echo "### Verify"
            echo
            echo '```'
            echo "sha256sum -c cirrus-${version}-release.apk.sha256"
            echo '```'
            echo
            echo "Signing certificate fingerprints are printed in the build log under"
            echo "\"Verify the APK is signed\"; they must match every prior release."
          } > release-notes.md
          cat release-notes.md

      # `gh` is preinstalled on the runner, so publishing needs no third-party action.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "Cirrus ${version}" \
            --notes-file release-notes.md \
            "dist/cirrus-${version}-release.apk" \
            "dist/cirrus-${version}-release.apk.sha256"
